document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e5be99ef-4d09-4af6-887c-f2c47916ec3a\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  body { margin: 0; background: #FAFAFA; }\n  a { color: #6F49E0; text-decoration: underline; }\n  a:hover { color: #4A2FB0; }\n  @keyframes cf-fade { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes cf-pop { 0% { opacity: 0; transform: scale(0.97); } 100% { opacity: 1; transform: scale(1); } }\n  @keyframes cf-rise { 0% { opacity: 0; transform: translate(-50%, 12px); } 100% { opacity: 1; transform: translate(-50%, 0); } }\n  input, textarea, select, button { box-sizing: border-box; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#FAFAFA; min-height:100vh; color:#262626; font-family:Helvetica,Arial,sans-serif;\">\n\n  <!-- ============ HEADER ============ -->\n  <header style=\"position:sticky; top:0; z-index:50; background:#FAFAFA; border-bottom:1px solid #D1D1D1;\">\n    <div style=\"display:flex; gap:2px;\">\n      <span style=\"flex:1; height:3px; background:#10C662;\"><\u002Fspan>\n      <span style=\"flex:1; height:3px; background:#4C6DC5;\"><\u002Fspan>\n      <span style=\"flex:1; height:3px; background:#6F49E0;\"><\u002Fspan>\n      <span style=\"flex:1; height:3px; background:#E2526C;\"><\u002Fspan>\n      <span style=\"flex:1; height:3px; background:#E67539;\"><\u002Fspan>\n      <span style=\"flex:1; height:3px; background:#F8E056;\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"max-width:1040px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;\">\n      <button sc-camel-on-click=\"{{ goLanding }}\" style=\"background:none; border:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:0;\">\n        <span style=\"text-align:left; line-height:1.15;\">\n          <span style=\"display:block; font-size:15px; font-weight:700; color:#262626;\">Commons Fabric<\u002Fspan>\n          <span style=\"display:block; font-size:9.5px; color:#8A8A8A; letter-spacing:0.06em; font-weight:700;\">COMMUNITY CALENDAR<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n      <nav style=\"display:flex; gap:22px; margin-left:auto; margin-right:8px;\">\n        <button sc-camel-on-click=\"{{ goLanding }}\" style=\"background:none; border:none; cursor:pointer; font-family:Helvetica,Arial,sans-serif; font-size:13px; font-weight:700; padding:4px 0 6px; color:{{ navEventsColor }}; border-bottom:{{ navEventsBorder }};\">Events<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goDirectory }}\" style=\"background:none; border:none; cursor:pointer; font-family:Helvetica,Arial,sans-serif; font-size:13px; font-weight:700; padding:4px 0 6px; color:{{ navDirectoryColor }}; border-bottom:{{ navDirectoryBorder }};\">Directory<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goAbout }}\" style=\"background:none; border:none; cursor:pointer; font-family:Helvetica,Arial,sans-serif; font-size:13px; font-weight:700; padding:4px 0 6px; color:{{ navAboutColor }}; border-bottom:{{ navAboutBorder }};\">About<\u002Fbutton>\n      <\u002Fnav>\n      <div style=\"display:flex; align-items:center; gap:8px;\">\n        <sc-if value=\"{{ hasSession }}\">\n          <span style=\"font-size:12px; color:#262626; font-weight:700; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ sessionName }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ logout }}\" style=\"background:#FAFAFA; color:#6B6B6B; border:1px solid #D1D1D1; padding:7px 13px; border-radius:8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; cursor:pointer; font-family:Helvetica,Arial,sans-serif;\" style-hover=\"border-color:#9A9A9A;\">Log out<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noSession }}\">\n          <button sc-camel-on-click=\"{{ openLogin }}\" style=\"background:#FAFAFA; color:#6B6B6B; border:1px solid #D1D1D1; padding:7px 13px; border-radius:8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; cursor:pointer; font-family:Helvetica,Arial,sans-serif;\" style-hover=\"border-color:#9A9A9A;\">Log in<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ openCreateAccount }}\" style=\"background:linear-gradient(135deg,#6F49E0,#B297D6); color:#fff; border:none; padding:7px 13px; border-radius:8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; cursor:pointer; font-family:Helvetica,Arial,sans-serif;\">Create account<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"max-width:1040px; margin:0 auto; padding:36px 24px 80px;\">\n\n    <!-- ============ LANDING ============ -->\n    <sc-if value=\"{{ isLanding }}\">\n      <div style=\"margin-bottom:24px;\">\n        <h1 style=\"font-family:Helvetica,Arial,sans-serif; font-size:clamp(26px,5vw,36px); font-weight:700; color:#262626; margin:0 0 10px; letter-spacing:-0.01em; line-height:1.1;\">What's happening at the Hub<\u002Fh1>\n        <p style=\"font-size:14px; color:#6B6B6B; margin:0; max-width:560px; line-height:1.6;\">One shared place to discover and share events across the Rideau Community Hub network.<\u002Fp>\n        <div style=\"display:flex; gap:12px; margin-top:20px; align-items:center; flex-wrap:wrap;\">\n          <div style=\"display:inline-flex; background:#FAFAFA; border:1px solid #D1D1D1; border-radius:999px; padding:3px;\">\n            <button sc-camel-on-click=\"{{ setGrid }}\" style=\"border:none; cursor:pointer; font-family:Helvetica,Arial,sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; padding:7px 16px; border-radius:999px; background:{{ gridBtnBg }}; color:{{ gridBtnColor }};\">Card grid<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ setCalendar }}\" style=\"border:none; cursor:pointer; font-family:Helvetica,Arial,sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; padding:7px 16px; border-radius:999px; background:{{ calBtnBg }}; color:{{ calBtnColor }};\">Calendar<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasSession }}\">\n            <button sc-camel-on-click=\"{{ openCreateEvent }}\" style=\"background:linear-gradient(135deg,#6F49E0,#B297D6); color:#fff; border:none; padding:9px 18px; border-radius:8px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; cursor:pointer; font-family:Helvetica,Arial,sans-serif;\">+ Create an event<\u002Fbutton>\n          <\u002Fsc-if>\n          <div style=\"display:flex; align-items:center; gap:12px; margin-left:auto;\">\n          <div style=\"position:relative;\">\n            <button sc-camel-on-click=\"{{ toggleOrgMenu }}\" style=\"display:inline-flex; align-items:center; gap:8px; background:#FAFAFA; color:#262626; border:1px solid {{ orgMenuBorder }}; padding:8px 14px; border-radius:8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; cursor:pointer; font-family:Helvetica,Arial,sans-serif;\" style-hover=\"border-color:#9A9A9A;\">\n              <span style=\"width:12px; height:4px; border-radius:2px; background:{{ orgMenuSwatch }};\"><\u002Fspan>{{ orgFilterLabel }}\n              <span style=\"color:#8A8A8A; font-size:9px;\">▾<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ orgMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute; z-index:20; top:calc(100% + 6px); right:0; left:auto; width:264px; background:#FAFAFA; border:1px solid #262626; border-radius:12px; padding:14px; animation:cf-pop .16s ease;\">\n                <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;\">\n                  <span style=\"font-size:10px; font-weight:700; letter-spacing:0.1em; color:#8A8A8A;\">FILTER BY ORG<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ selectAllOrgs }}\" style=\"background:none; border:none; padding:0; cursor:pointer; font-family:Helvetica,Arial,sans-serif; font-size:10.5px; font-weight:700; color:#6B6B6B; text-decoration:underline;\" style-hover=\"color:#262626;\">All<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:2px; margin-bottom:12px; max-height:230px; overflow-y:auto;\">\n                  <sc-for list=\"{{ orgFilterOptions }}\" as=\"f\" hint-placeholder-count=\"6\">\n                    <label style=\"display:flex; align-items:flex-start; gap:9px; padding:6px 4px; border-radius:6px; cursor:pointer;\" style-hover=\"background:#F5F5F5;\">\n                      <input type=\"checkbox\" checked=\"{{ f.checked }}\" sc-camel-on-change=\"{{ f.onToggle }}\" style=\"margin:1px 0 0; width:13px; height:13px; flex-shrink:0; accent-color:{{ accentColor }}; cursor:pointer;\">\n                      <span style=\"width:12px; height:4px; border-radius:2px; flex-shrink:0; margin-top:5px; background:{{ f.grad }};\"><\u002Fspan>\n                      <span style=\"font-size:11.5px; color:#262626; line-height:1.35; min-width:0;\">{{ f.shortName }}<\u002Fspan>\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ applyOrgFilter }}\" style=\"width:100%; background:{{ applyBtnBg }}; color:{{ applyBtnColor }}; border:1px solid {{ applyBtnBorder }}; padding:9px; border-radius:8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; cursor:pointer; font-family:Helvetica,Arial,sans-serif;\">Apply<\u002Fbutton>\n                <p style=\"font-size:10.5px; color:#8A8A8A; margin:9px 0 0; line-height:1.4;\">{{ orgFilterStatus }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isCalendarView }}\">\n            <div style=\"display:flex; align-items:center; gap:9px;\">\n              <span style=\"font-size:10px; font-weight:700; letter-spacing:0.1em; color:#8A8A8A;\">SHOW<\u002Fspan>\n              <div style=\"display:inline-flex; background:#FAFAFA; border:1px solid #D1D1D1; border-radius:999px; padding:3px;\">\n                <button sc-camel-on-click=\"{{ setSpanDay }}\" style=\"border:none; cursor:pointer; font-family:Helvetica,Arial,sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; padding:7px 14px; border-radius:999px; background:{{ spanDayBg }}; color:{{ spanDayColor }};\">Day<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setSpanWeek }}\" style=\"border:none; cursor:pointer; font-family:Helvetica,Arial,sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; padding:7px 14px; border-radius:999px; background:{{ spanWeekBg }}; color:{{ spanWeekColor }};\">Week<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setSpanMonth }}\" style=\"border:none; cursor:pointer; font-family:Helvetica,Arial,sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; padding:7px 14px; border-radius:999px; background:{{ spanMonthBg }}; color:{{ spanMonthColor }};\">Month<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isGridView }}\">\n        <div style=\"display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:#FAFAFA; border:1px solid #D1D1D1; border-radius:12px; padding:12px 14px; margin-bottom:18px;\">\n          <span style=\"font-size:10px; font-weight:700; letter-spacing:0.1em; color:#8A8A8A;\">FILTER BY DATE<\u002Fspan>\n          <label style=\"display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:700; letter-spacing:0.06em; color:#6B6B6B; text-transform:uppercase;\">From\n            <input type=\"date\" value=\"{{ rangeStart }}\" sc-camel-on-change=\"{{ onRangeStartChange }}\" style=\"padding:7px 9px; border-radius:8px; font-size:12.5px; border:1px solid #D1D1D1; background:#FFFFFF; color:#262626; font-family:Helvetica,Arial,sans-serif; outline:none;\" style-focus=\"border:1px solid #262626; border-bottom:2px solid #6F49E0;\">\n          <\u002Flabel>\n          <label style=\"display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:700; letter-spacing:0.06em; color:#6B6B6B; text-transform:uppercase;\">To\n            <input type=\"date\" value=\"{{ rangeEnd }}\" sc-camel-on-change=\"{{ onRangeEndChange }}\" style=\"padding:7px 9px; border-radius:8px; font-size:12.5px; border:1px solid #D1D1D1; background:#FFFFFF; color:#262626; font-family:Helvetica,Arial,sans-serif; outline:none;\" style-focus=\"border:1px solid #262626; border-bottom:2px solid #6F49E0;\">\n          <\u002Flabel>\n          <sc-if value=\"{{ hasRange }}\">\n            <button sc-camel-on-click=\"{{ clearRange }}\" style=\"background:#FAFAFA; color:#6B6B6B; border:1px solid #D1D1D1; padding:7px 12px; border-radius:8px; font-size:11px; font-weight:700; text-transform:uppercase; cursor:pointer; font-family:Helvetica,Arial,sans-serif;\">Clear<\u002Fbutton>\n          <\u002Fsc-if>\n          <span style=\"margin-left:auto; font-size:11.5px; color:#8A8A8A;\">{{ gridCountLabel }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isGridEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#F5F5F5; border:1px solid #D1D1D1; border-radius:8px; padding:36px; text-align:center; color:#8A8A8A; font-size:12px;\">No events fall within this date range.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isGridNotEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:18px;\">\n            <sc-for list=\"{{ gridEvents }}\" as=\"e\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ e.onClick }}\" style=\"background:#FAFAFA; border:1px solid #D1D1D1; border-radius:12px; cursor:pointer; display:flex; gap:14px; padding:18px; animation:cf-fade .3s ease;\" style-hover=\"border-color:#9A9A9A;\">\n                <span style=\"width:3px; align-self:stretch; flex-shrink:0; background:{{ e.railGrad }};\"><\u002Fspan>\n                <div style=\"min-width:0; flex:1; display:flex; flex-direction:column; gap:8px;\">\n                  <sc-if value=\"{{ e.hasTags }}\">\n                    <div style=\"display:flex; gap:6px; flex-wrap:wrap;\">\n                      <sc-if value=\"{{ e.hasReg }}\">\n                        <span style=\"font-size:9px; font-weight:700; text-transform:uppercase; color:#4C6DC5; border:1px solid #94BFFE; padding:2px 6px; border-radius:6px; background:linear-gradient(180deg,#F5F5F5,#EAF0FB);\">Registration<\u002Fspan>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ e.hasVol }}\">\n                        <span style=\"font-size:9px; font-weight:700; text-transform:uppercase; color:#C4551F; border:1px solid #F39A6B; padding:2px 6px; border-radius:6px; background:linear-gradient(180deg,#F5F5F5,#FBEDE4);\">Volunteers wanted<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div>\n                    <span style=\"display:block; font-size:9.5px; font-weight:700; color:#8A8A8A; letter-spacing:0.06em; margin-bottom:4px;\">{{ e.dateLabel }}<\u002Fspan>\n                    <h3 style=\"font-family:Helvetica,Arial,sans-serif; font-size:15px; font-weight:700; color:#262626; margin:0; line-height:1.3;\">{{ e.title }}<\u002Fh3>\n                    <p style=\"font-size:11.5px; color:#8A8A8A; font-weight:700; margin:4px 0 0;\">{{ e.org }}<\u002Fp>\n t:1.2;\">{{ profileOrg.name }}<\u002Fh1>\n            <p style=\"font-size:13.5px; color:#6B6B6B; line-height:1.6; margin:0 0 14px; max-width:600px;\">{{ profileOrg.blurb }}<\u002Fp>\n            <div style=\"display:flex; gap:20px; flex-wrap:wrap; font-size:12px;\">\n              <span style=\"color:#6B6B6B; display:inline-flex; align-items:center; gap:6px;\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M3.5 7l8.5 6 8.5-6\"><\u002Fpath><\u002Fsvg><a href=\"mailto:{{ profileOrg.contact }}\" style=\"color:#262626;\">{{ profileOrg.contact }}<\u002Fa><\u002Fspan>\n              <span style=\"color:#6B6B6B; display:inline-flex; align-items:center; gap:6px;\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1\"><\u002Fpath><path d=\"M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1\"><\u002Fpath><\u002Fsvg><a href=\"#\" sc-camel-on-click=\"{{ preventDefault }}\" style=\"color:#262626;\">{{ profileOrg.website }}<\u002Fa><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:2px; background:linear-gradient(90deg,{{ profileOrg.c1 }},{{ profileOrg.c2 }},#F5F5F5);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <h2 style=\"font-family:Helvetica,Arial,sans-serif; font-size:16px; font-weight:700; color:#262626; margin:0 0 14px;\">Upcoming events<\u002Fh2>\n      <sc-if value=\"{{ profileHasNoEvents }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#F5F5F5; border:1px solid #D1D1D1; border-radius:8px; padding:24px; text-align:center; color:#8A8A8A; font-size:12px;\">No upcoming events from this organization yet.<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex; flex-direction:column; gap:0; background:#FAFAFA; border:1px solid #D1D1D1; border-radius:12px; overflow:hidden;\">\n        <sc-for list=\"{{ profileEvents }}\" as=\"e\" hint-placeholder-count=\"2\">\n          <div sc-camel-on-click=\"{{ e.onClick }}\" style=\"display:flex; gap:14px; align-items:flex-start; padding:14px 18px; border-bottom:1px solid #D1D1D1; cursor:pointer;\" style-hover=\"background:#F5F5F5;\">\n            <span style=\"width:34px; flex-shrink:0; font-size:9.5px; font-weight:700; color:#8A8A8A; line-height:1.3; padding-top:2px;\">{{ e.dateStack }}<\u002Fspan>\n            <span style=\"width:3px; align-self:stretch; background:{{ e.railGrad }}; flex-shrink:0;\"><\u002Fspan>\n            <div style=\"flex:1; min-width:0;\">\n              <div style=\"font-size:13px; font-weight:700; color:#262626;\">{{ e.title }}<\u002Fdiv>\n              <div style=\"font-size:11px; color:#8A8A8A; margin-top:3px;\">{{ e.timeStr }} · {{ e.location }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ ABOUT ============ -->\n    <sc-if value=\"{{ isAbout }}\">\n      <div style=\"margin-bottom:24px;\">\n        <h1 style=\"font-family:Helvetica,Arial,sans-serif; font-size:clamp(26px,5vw,36px); font-weight:700; color:#262626; margin:0 0 10px; letter-spacing:-0.01em; line-height:1.1;\">About Commons Fabric<\u002Fh1>\n        <p style=\"font-size:14px; color:#6B6B6B; margin:0; max-width:560px; line-height:1.6;\">Why we built this, and what it's for.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:18px; max-width:640px;\">\n        <div style=\"background:#FAFAFA; border:1px solid #D1D1D1; border-radius:12px; padding:22px;\">\n          <h2 style=\"font-family:Helvetica,Arial,sans-serif; font-size:15px; font-weight:700; color:#262626; margin:0 0 10px;\">What this is<\u002Fh2>\n          <p style=\"font-size:13.5px; color:#6B6B6B; line-height:1.65; margin:0;\">Commons Fabric is a shared community calendar and directory for the Rideau Community Hub. Organizations sharing space at the Hub can list their events in one place, and neighbours can browse everything happening in one view instead of checking a dozen separate sites.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FAFAFA; border:1px solid #D1D1D1; border-radius:12px; padding:22px;\">\n          <h2 style=\"font-family:Helvetica,Arial,sans-serif; font-size:15px; font-weight:700; color:#262626; margin:0 0 10px;\">Why it exists<\u002Fh2>\n          <p style=\"font-size:13.5px; color:#6B6B6B; line-height:1.65; margin:0;\">Event details were scattered across flyers, mailing lists, and individual org websites, and it was hard for anyone to get a full picture of what was happening at the Hub. Commons Fabric gives every organization a place to post events and be discovered by the wider community.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FAFAFA; border:1px solid #D1D1D1; border-radius:12px; padding:22px;\">\n          <h2 style=\"font-family:Helvetica,Arial,sans-serif; font-size:15px; font-weight:700; color:#262626; margin:0 0 10px;\">Get involved<\u002Fh2>\n          <p style=\"font-size:13.5px; color:#6B6B6B; line-height:1.65; margin:0;\">If your organization shares space at the Hub, create an account to start publishing your own events and appear in the directory.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <footer style=\"background:#1E1E1E; border-top:1px solid #333333; padding:22px 24px; margin-top:40px;\">\n    <div style=\"max-width:1040px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;\">\n      <span style=\"font-size:11.5px; color:#B8B8B8;\">Powered by the people at the Commons Fabric<\u002Fspan>\n      <nav style=\"display:flex; gap:18px;\">\n        <button sc-camel-on-click=\"{{ goLanding }}\" style=\"background:none; border:none; cursor:pointer; font-family:Helvetica,Arial,sans-serif; font-size:11.5px; font-weight:700; color:#B8B8B8; padding:0;\" style-hover=\"color:#FFFFFF;\">Events<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goDirectory }}\" style=\"background:none; border:none; cursor:pointer; font-family:Helvetica,Arial,sans-serif; font-size:11.5px; font-weight:700; color:#B8B8B8; padding:0;\" style-hover=\"color:#FFFFFF;\">Directory<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goAbout }}\" style=\"background:none; border:none; cursor:pointer; font-family:Helvetica,Arial,sans-serif; font-size:11.5px; font-weight:700; color:#B8B8B8; padding:0;\" style-hover=\"color:#FFFFFF;\">About<\u002Fbutton>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- ============ MODAL: CREATE ACCOUNT ============ -->\n  <sc-if value=\"{{ showCreateAccount }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-mouse-down=\"{{ overlayClose }}\" style=\"position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(38,38,38,0.55); animation:cf-fade .16s ease;\">\n      <div style=\"width:100%; max-width:440px; max-height:88vh; overflow-y:auto; background:#FAFAFA; border-radius:12px; border:1px solid #262626; animation:cf-pop .18s ease;\">\n        <div style=\"display:flex; gap:2px;\">\n          <span style=\"flex:1; height:3px; background:#6F49E0;\"><\u002Fspan><span style=\"flex:1; height:3px; background:#9570C7;\"><\u002Fspan><span style=\"flex:1; height:3px; background:#B297D6;\"><\u002Fspan><span style=\"flex:1; height:3px; background:#C6AEE7;\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:20px 24px 0; position:relative; border-bottom:1px solid #D1D1D1; padding-bottom:16px;\">\n          <button sc-camel-on-click=\"{{ closeModal }}\" aria-label=\"Close\" style=\"position:absolute; top:14px; right:16px; width:28px; height:28px; border-radius:8px; border:1px solid #D1D1D1; background:#FAFAFA; cursor:pointer; color:#6B6B6B; font-size:15px;\" style-hover=\"border-color:#9A9A9A;\">×<\u002Fbutton>\n          <h2 style=\"font-family:Helvetica,Arial,sans-serif; font-size:18px; font-weight:700; color:#262626; margin:0; padding-right:32px;\">Create account<\u002Fh2>\n          <p style=\"font-size:12px; color:#6B6B6B; margin:6px 0 0;\">{{ caSubtitle }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:18px 24px 24px;\">\n          <sc-if value=\"{{ caIsStep1 }}\">\n            <label style=\"display:block; margin-bottom:14px;\">\n              <span style=\"display:block; font-size:10px; font-weight:700; letter-spacing:0.06em; color:#6B6B6B; margin-bottom:6px; text-transform:uppercase;\">Organization name<\u002Fspan>\n              <input value=\"{{ caForm.name }}\" sc-camel-on-change=\"{{ caSetName }}\" placeholder=\"e.g. Ottawa Civic Tech\" style=\"width:100%; padding:9px 11px; border-radius:8px; font-size:12.5px; border:1px solid {{ caNameBorder }}; background:#FFFFFF; color:#262626; font-family:Helvetica,Arial,sans-serif; outline:none;\" style-focus=\"border:1px solid #262626; border-bottom:2px solid #6F49E0;\">\n              <sc-if value=\"{{ caErrors.name }}\"><span style=\"display:block; margin-top:5px; font-size:10.5px; color:#F50A1E; font-weight:700;\">{{ caErrors.name }}<\u002Fspan><\u002Fsc-if>\n            <\u002Flabel>\n            <label style=\"display:block; margin-bottom:14px;\">\n              <span style=\"display:block; font-size:10px; font-weight:700; letter-spacing:0.06em; color:#6B6B6B; margin-bottom:6px; text-transform:uppercase;\">Email<\u002Fspan>\n              <input value=\"{{ caForm.email }}\" sc-camel-on-change=\"{{ caSetEmail }}\" placeholder=\"you@org.example\" style=\"width:100%; padding:9px 11px; border-radius:8px; font-size:12.5px; border:1px solid {{ caEmailBorder }}; background:#FFFFFF; color:#262626; font-family:Helvetica,Arial,sans-serif; outline:none;\" style-focus=\"border:1px solid #262626; border-bottom:2px solid #6F49E0;\">\n              <sc-if value=\"{{ caErrors.email }}\"><span style=\"display:block; margin-top:5px; font-size:10.5px; color:#F50A1E; font-weight:700;\">{{ caErrors.email }}<\u002Fspan><\u002Fsc-if>\n            <\u002Flabel>\n            <label style=\"display:block; margin-bottom:18px;\">\n              <span style=\"display:block; font-size:10px; font-weight:700; letter-spacing:0.06em; color:#6B6B6B; margin-bottom:6px; text-transform:uppercase;\">Password<\u002Fspan>\n              <input type=\"password\" value=\"{{ caForm.password }}\" sc-camel-on-change=\"{{ caSetPassword }}\" placeholder=\"At least 6 characters\" style=\"width:100%; padding:9px 11px; border-radius:8px; font-size:12.5px; border:1px solid {{ caPasswordBorder }}; background:#FFFFFF; color:#262626; font-family:Helvetica,Arial,sans-serif; outline:none;\" style-focus=\"border:1px solid #262626; border-bottom:2px solid #6F49E0;\">\n              <sc-if value=\"{{ caErrors.password }}\"><span style=\"display:block; margin-top:5px; font-size:10.5px; color:#F50A1E; font-weight:700;\">{{ caErrors.password }}<\u002Fspan><\u002Fsc-if>\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ caContinue }}\" style=\"width:100%; background:linear-gradient(135deg,#6F49E0,#B297D6); color:#fff; border:none; padding:10px; border-radius:8px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; cursor:pointer; font-family:Helvetica,Arial,sans-serif;\">Continue<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ caIsStep2 }}\">\n            <div style=\"background:#F5F5F5; border:1px solid #D1D1D1; border-radius:8px; padding:16px; margin-bottom:16px;\">\n              <div style=\"display:flex; justify-content:space-between; gap:16px; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid #D1D1D1;\"><span style=\"font-size:11px; color:#8A8A8A; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;\">Organization<\u002Fspan><span style=\"font-size:13px; color:#262626; font-weight:500; text-align:right;\">{{ caForm.name }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; justify-content:space-between; gap:16px;\"><span style=\"font-size:11px; color:#8A8A8A; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;\">Email<\u002Fspan><span style=\"font-size:13px; color:#262626; font-weight:500; text-align:right;\">{{ caForm.email }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size:13px; font-weight:700; color:#262626; margin:0 0 14px;\">Is this information correct?<\u002Fp>\n            <div style=\"display:flex; gap:10px;\">\n              <button sc-camel-on-click=\"{{ caBack }}\" style=\"flex:1; background:#FAFAFA; color:#262626; border:1px solid #262626; padding:9px; border-radius:8px; font-size:12px; font-weight:700; text-transform:uppercase; cursor:pointer; font-family:Helvetica,Arial,sans-serif;\">No, edit<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ caSubmit }}\" style=\"flex:1; background:linear-gradient(135deg,#6F49E0,#B297D6); color:#fff; border:none; padding:9px; border-radius:8px; font-size:12px; font-weight:700; text-transform:uppercase; cursor:pointer; font-family:Helvetica,Arial,sans-serif;\">Yes, create<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ MODAL: LOGIN ============ -->\n  <sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-mouse-down=\"{{ overlayClose }}\" style=\"position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(38,38,38,0.55); animation:cf-fade .16s ease;\">\n      <div style=\"width:100%; max-width:400px; max-height:88vh; overflow-y:auto; background:#FAFAFA; border-radius:12px; border:1px solid #262626; animation:cf-pop .18s ease;\">\n        <div style=\"display:flex; gap:2px;\">\n          <span style=\"flex:1; height:3px; background:#6F49E0;\"><\u002Fspan><span style=\"flex:1; height:3px; background:#9570C7;\"><\u002Fspan><span style=\"flex:1; height:3px; background:#B297D6;\"><\u002Fspan><span style=\"flex:1; height:3px; background:#C6AEE7;\"><\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ liIsLoginMode }}\">\n          <div style=\"padding:20px 24px 0; position:relative; border-bottom:1px solid #D1D1D1; padding-bottom:16px;\">\n            <button sc-camel-on-click=\"{{ closeModal }}\" aria-label=\"Close\" style=\"position:absolute; top:14px; right:16px; width:28px; height:28px; border-radius:8px; border:1px solid #D1D1D1; background:#FAFAFA; cursor:pointer; color:#6B6B6B; font-size:15px;\" style-hover=\"border-color:#9A9A9A;\">×<\u002Fbutton>\n            <h2 style=\"font-family:Helvetica,Arial,sans-serif; font-size:18px; font-weight:700; color:#262626; margin:0; padding-right:32px;\">Log in<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"padding:18px 24px 24px;\">\n            <div style=\"background:#F5F5F5; border:1px solid #D1D1D1; border-radius:8px; padding:9px 12px; margin-bottom:16px; font-size:11.5px; color:#262626;\">Demo hint: use <strong>hi@ottawacivictech.example<\u002Fstrong> / <strong>demo123<\u002Fstrong><\u002Fdiv>\n            <label style=\"display:block; margin-bottom:14px;\">\n              <span style=\"display:block; font-size:10px; font-weight:700; letter-spacing:0.06em; color:#6B6B6B; margin-bottom:6px; text-transform:uppercase;\">Email<\u002Fspan>\n              <input value=\"{{ liCreds.email }}\" sc-camel-on-change=\"{{ liSetEmail }}\" placeholder=\"you@org.example\" style=\"width:100%; padding:9px 11px; border-radius:8px; font-size:12.5px; border:1px solid {{ liBorder }}; background:#FFFFFF; color:#262626; font-family:Helvetica,Arial,sans-serif; outline:none;\" style-focus=\"border:1px solid #262626; border-bottom:2px solid #6F49E0;\">\n            <\u002Flabel>\n            <label style=\"display:block; margin-bottom:16px;\">\n              <span style=\"display:block; font-size:10px; font-weight:700; letter-spacing:0.06em; color:#6B6B6B; margin-bottom:6px; text-transform:uppercase;\">Password<\u002Fspan>\n              <input type=\"password\" value=\"{{ liCreds.password }}\" sc-camel-on-change=\"{{ liSetPassword }}\" placeholder=\"Your password\" style=\"width:100%; padding:9px 11px; border-radius:8px; font-size:12.5px; border:1px solid {{ liBorder }}; background:#FFFFFF; color:#262626; font-family:Helvetica,Arial,sans-serif; outline:none;\" style-focus=\"border:1px solid #262626; border-bottom:2px solid #6F49E0;\">\n              <sc-if value=\"{{ liErr }}\"><span style=\"display:block; margin-top:5px; font-size:10.5px; color:#F50A1E; font-weight:700;\">{{ liErr }}<\u002Fspan><\u002Fsc-if>\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ liDoLogin }}\" style=\"width:100%; background:linear-gradient(135deg,#6F49E0,#B297D6); color:#fff; border:none; padding:10px; border-radius:8px; font-size:12px; font-weight:700; text-transform:uppercase; cursor:pointer; font-family:Helvetica,Arial,sans-serif;\">Log in<\u002Fbutton>\n            <div style=\"display:flex; justify-content:center; gap:18px; margin-top:16px;\">\n              <button sc-camel-on-click=\"{{ liGoPassword }}\" style=\"background:none; border:none; color:#6B6B6B; font-size:11.5px; cursor:pointer; text-decoration:underline; padding:0; font-family:Helvetica,Arial,sans-serif;\">Change password<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ liGoEmail }}\" style=\"background:none; border:none; color:#6B6B6B; font-size:11.5px; cursor:pointer; text-decoration:underline; padding:0; font-family:Helvetica,Arial,sans-serif;\">Change email<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ liIsC st v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }\nfunction fmtPlainDate(d) { const dt = parseDate(d); return DOW_FULL[dt.getDay()] + \", \" + MONTHS_FULL[dt.getMonth()] + \" \" + ordinal(dt.getDate()) + \", \" + dt.getFullYear(); }\nconst DEFAULT_DURATION_MIN = 90;\nfunction minutesOf(t) { const [h, m] = t.split(\":\").map(Number); return h * 60 + m; }\nfunction fmtMinutes(mins) {\n  const h = Math.floor(mins / 60) % 24, m = mins % 60;\n  const ampm = h >= 12 ? \"PM\" : \"AM\";\n  const hr = h % 12 === 0 ? 12 : h % 12;\n  return hr + \":\" + String(m).padStart(2, \"0\") + \" \" + ampm;\n}\nfunction fmtShortMinutes(mins) {\n  const h = Math.floor(mins / 60) % 24, m = mins % 60;\n  const suffix = h >= 12 ? \"p\" : \"a\";\n  const hr = h % 12 === 0 ? 12 : h % 12;\n  return hr + (m ? \":\" + String(m).padStart(2, \"0\") : \"\") + suffix;\n}\nfunction fmtTime(t) {\n  const [h, m] = t.split(\":\").map(Number);\n  const ampm = h >= 12 ? \"PM\" : \"AM\";\n  const hr = h % 12 === 0 ? 12 : h % 12;\n  return hr + \":\" + String(m).padStart(2, \"0\") + \" \" + ampm;\n}\n\nconst PALETTE = {\n  green:  { c1:\"#10C662\", c2:\"#90DF97\", tint:\"#EAF6EC\", text:\"#0D9E52\", stops:[\"#10C662\",\"#3ACE73\",\"#64D685\",\"#90DF97\"] },\n  blue:   { c1:\"#4C6DC5\", c2:\"#94BFFE\", tint:\"#EAF0FB\", text:\"#4C6DC5\", stops:[\"#4C6DC5\",\"#6488D8\",\"#7CA3EB\",\"#94BFFE\"] },\n  purple: { c1:\"#6F49E0\", c2:\"#C6AEE7\", tint:\"#F1EBF8\", text:\"#6F49E0\", stops:[\"#6F49E0\",\"#9570C7\",\"#B297D6\",\"#C6AEE7\"] },\n  red:    { c1:\"#E2526C\", c2:\"#ED8497\", tint:\"#FCEDEF\", text:\"#C63A54\", stops:[\"#E2526C\",\"#E6637A\",\"#E97388\",\"#ED8497\"] },\n  orange: { c1:\"#E67539\", c2:\"#F39A6B\", tint:\"#FBEDE4\", text:\"#C4551F\", stops:[\"#E67539\",\"#EA814A\",\"#EF8D5A\",\"#F39A6B\"] },\n  yellow: { c1:\"#F8E056\", c2:\"#FFF2A8\", tint:\"#FDF8E0\", text:\"#8A6B00\", stops:[\"#F8E056\",\"#FAE671\",\"#FDEC8C\",\"#FFF2A8\"] },\n};\nconst HOST_ORDER = [\"green\",\"blue\",\"pur
